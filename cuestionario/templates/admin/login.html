{% extends 'base.html' %}

{% block title %}Acceso Administrador - Evaluación Conductores{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 3rem auto;">
  <div class="card">
    <div class="card-header" style="text-align: center;">
      <h1 class="card-title">Panel de Administración</h1>
      <p class="card-subtitle">Ingrese sus credenciales de acceso</p>
    </div>

    <form method="POST" action="{% url 'admin_login' %}">
      {% csrf_token %}

      <div class="form-group">
        <label for="username" class="form-label">Usuario</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="Nombre de usuario" required autofocus>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">
        Iniciar Sesión
      </button>
    </form>
  </div>
</div>
{% endblock %}
